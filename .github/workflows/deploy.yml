name: Deploy

# Deployment is gated on CI. A failing check means no deploy — the `needs`
# dependency below is the whole point of this file, not a formality.
#
# What this file does NOT do is apply migrations. That is deliberate. A schema
# change is a decision with a rollback plan, taken by a person following
# DEPLOY_RUNBOOK part B; pushing it on every commit would make the riskiest
# operation in the system the most automatic one. There is also a concrete
# reason it would not work: the pinned Supabase CLI fails `db push` partway
# through with a connection error (see HANDOFF §3), so a migrate job here would
# be a pipeline that breaks rather than one that protects.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    name: Refuse to deploy on a failing CI run
    runs-on: ubuntu-latest
    steps:
      - name: CI must have succeeded
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: |
          echo "CI concluded '${{ github.event.workflow_run.conclusion }}'. Not deploying."
          exit 1

  release:
    name: Deploy the application
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Refuse to deploy without an explicit target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT:-}" ]; then
            echo "BLOCKED: no hosting target is configured."
            echo "Set the VERCEL_TOKEN secret and the VERCEL_PROJECT variable to enable this."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The build happens on Vercel with that project's environment variables.
      # Building here would produce an artefact configured for nothing.
      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
        run: |
          set -euo pipefail
          npx -y vercel@latest link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"
          npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" | tee deploy.log
          echo "Deployed commit ${{ github.event.workflow_run.head_sha || github.sha }}"

      # The demo seed exists to make a local machine useful. Loading it into a
      # shared environment would mix synthetic rows into real tenants, and every
      # honesty guarantee in this product depends on that never happening.
      - name: The seed is never applied outside a developer machine
        run: echo "supabase/seed.sql is local-only by design and is not applied here."

  smoke:
    name: The deployed stand answers and still carries its security headers
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Probe /login
        env:
          STAND_URL: ${{ vars.QADAM_STAND_URL }}
        run: |
          set -euo pipefail
          if [ -z "${STAND_URL:-}" ]; then
            echo "QADAM_STAND_URL is not set; nothing to probe."
            exit 1
          fi
          # A deploy that returns 200 but lost its headers means the proxy did
          # not run, which is a silent failure worth catching here.
          HEADERS=$(curl -sS -D - -o /dev/null --retry 5 --retry-all-errors --retry-delay 5 "${STAND_URL}/login")
          echo "$HEADERS" | head -20
          echo "$HEADERS" | grep -qi 'content-security-policy' || { echo "No CSP header."; exit 1; }
          echo "$HEADERS" | grep -qi "nonce-" || { echo "CSP carries no nonce — the proxy did not run."; exit 1; }
          echo "$HEADERS" | grep -qi 'strict-transport-security' || { echo "No HSTS header."; exit 1; }
